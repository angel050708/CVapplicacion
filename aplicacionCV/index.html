<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Taller de composición de currículums: escribe a la izquierda, compón la hoja a la derecha."
    />
    <title>Currículum — taller de composición</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Fija el tema antes del primer pintado para evitar el destello de tema.
      ;(() => {
        const saved = localStorage.getItem('cv-theme')
        const system = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme =
          saved ?? (system ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
